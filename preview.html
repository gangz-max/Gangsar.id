    // Component: Space Canvas
    function SpaceBackground() {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const starCount = Math.min(Math.floor((width * height) / 4500), 200);
        const stars = Array.from({ length: starCount }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 1.8 + 0.4,
          alpha: Math.random() * 0.8 + 0.2,
          speed: Math.random() * 0.02 + 0.005,
          color: Math.random() > 0.3 ? '#ffffff' : Math.random() > 0.5 ? '#8eb6fd' : '#00d2ff'
        }));

        const meteors = [];
        const createMeteor = () => {
          meteors.push({
            x: Math.random() * width * 1.2,
            y: Math.random() * (height * 0.4),
            length: Math.random() * 70 + 40,
            speed: Math.random() * 9 + 6,
            angle: Math.PI / 4,
            opacity: 1,
            fadeSpeed: 0.015,
            color: Math.random() > 0.5 ? '#2c67ed' : '#00d2ff'
          });
        };

        let timer = 0;
        const render = () => {
          ctx.clearRect(0, 0, width, height);

          // Cosmic gradient
          const bgGrad = ctx.createLinearGradient(0, 0, width, height);
          bgGrad.addColorStop(0, '#02040a');
          bgGrad.addColorStop(0.5, '#050c1e');
          bgGrad.addColorStop(1, '#02040a');
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, width, height);

          // Stars
          stars.forEach(s => {
            s.alpha += s.speed;
            if (s.alpha > 1 || s.alpha < 0.2) s.speed = -s.speed;
            ctx.fillStyle = s.color;
            ctx.globalAlpha = Math.max(0, Math.min(1, s.alpha));
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
          });

          // Meteors
          timer++;
          if (timer > 100 && Math.random() < 0.04) {
            createMeteor();
            timer = 0;
          }

          for (let i = meteors.length - 1; i >= 0; i--) {
            const m = meteors[i];
            m.x += Math.cos(m.angle) * m.speed;
            m.y += Math.sin(m.angle) * m.speed;
            m.opacity -= m.fadeSpeed;
            if (m.opacity <= 0) { meteors.splice(i, 1); continue; }

            const tailX = m.x - Math.cos(m.angle) * m.length;
            const tailY = m.y - Math.sin(m.angle) * m.length;
            const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
            grad.addColorStop(0, `rgba(255, 255, 255, ${m.opacity})`);
            grad.addColorStop(0.4, `rgba(44, 103, 237, ${m.opacity * 0.8})`);
            grad.addColorStop(1, 'transparent');

            ctx.strokeStyle = grad;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(m.x, m.y);
            ctx.lineTo(tailX, tailY);
            ctx.stroke();
          }

          animationFrameId = requestAnimationFrame(render);
        };
        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0" />;
    }

              <h1 className="text-4xl sm:text-6xl md:text-7xl lg:text-8xl font-extrabold tracking-tight text-white mb-6">
                Halo, Saya{' '}
                <span className="bg-gradient-to-r from-white via-[#8eb6fd] to-[#2c67ed] bg-clip-text text-transparent drop-shadow-[0_0_35px_rgba(44,103,237,0.6)]">
                  {personalInfo.name}
                </span>
              </h1>

              {/* Typewriter text */}
              <div className="h-16 flex items-center justify-center mb-6">
                <div className="text-xl sm:text-2xl md:text-4xl font-mono font-semibold text-slate-200">
                  <span className="text-[#2c67ed] mr-2">&gt;</span>
                  <span className="text-slate-300 mr-2">I am a</span>
                  <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#00d2ff] via-[#5990fb] to-[#2c67ed] underline decoration-[#2c67ed]/60 underline-offset-8">
                    {currentText}
                  </span>
                  <span className="inline-block w-1 h-6 md:h-8 bg-[#00d2ff] ml-1 animate-pulse align-middle" />
                </div>
              </div>

              <p className="text-slate-400 text-base md:text-lg max-w-2xl mx-auto leading-relaxed mb-10 font-light">
                {personalInfo.bio}
              </p>

              <div className="flex flex-wrap items-center justify-center gap-4">
                <button
                  onClick={() => scrollTo('portfolio')}
                  className="px-8 py-3.5 rounded-full bg-gradient-to-r from-[#2c67ed] to-[#1d4fd8] text-white font-semibold shadow-[0_0_25px_rgba(44,103,237,0.7)] hover:shadow-[0_0_35px_rgba(0,210,255,0.7)] border border-[#00d2ff]/40 transition-all transform hover:-translate-y-0.5"
                >
                  🚀 Lihat Portfolio
                </button>
                <button
                  onClick={() => scrollTo('contact')}
                  className="px-7 py-3.5 rounded-full bg-[#060b1e]/80 hover:bg-[#0f1d47] text-slate-200 hover:text-white font-semibold border border-[#2c67ed]/40 hover:border-[#00d2ff]/60 shadow-[0_0_15px_rgba(44,103,237,0.2)] transition-all transform hover:-translate-y-0.5"
                >
                  ✉️ Hubungi Saya
                </button>
              </div>
            </div>
          </section>

          {/* SPANDUK MENYILANG */}
          <CrossBanner />

          {/* ABOUT ME SECTION */}
          <section id="about" className="relative py-24 px-4 md:px-8 max-w-7xl mx-auto z-10">
            <div className="text-center mb-16">
              <span className="px-3.5 py-1.5 rounded-full bg-[#0b1430] border border-[#2c67ed]/40 text-xs font-mono uppercase tracking-widest text-[#00d2ff] mb-3 inline-block">
                Biografi & Perjalanan
              </span>
              <h2 className="text-3xl md:text-5xl font-extrabold text-white">
                About <span className="bg-gradient-to-r from-[#00d2ff] to-[#2c67ed] bg-clip-text text-transparent">Me</span>
              </h2>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center mb-16">
              <div className="lg:col-span-5 flex justify-center">
                <div className="relative w-64 h-64 sm:w-72 sm:h-72 rounded-3xl bg-[#060b1e] border-2 border-[#2c67ed]/60 p-3 shadow-[0_0_35px_rgba(44,103,237,0.4)]">
                  <img
                    src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&auto=format&fit=crop&q=80"
                    alt={personalInfo.name}
                    className="w-full h-full object-cover object-top rounded-2xl filter brightness-95"
                  />
                  <div className="absolute bottom-5 left-5 right-5 p-2 rounded-xl bg-[#060b1e]/90 border border-[#2c67ed]/40 flex items-center justify-between text-xs">
                    <span className="text-emerald-400 flex items-center gap-1">● Active Developer</span>
                    <span className="text-[#00d2ff] font-mono">ID 🇮🇩</span>
                  </div>
                </div>
              </div>

              <div className="lg:col-span-7 space-y-6">
                <div className="p-6 md:p-8 rounded-3xl bg-[#060b1e]/80 border border-[#2c67ed]/30 shadow-[0_0_20px_rgba(44,103,237,0.15)] backdrop-blur-xl">
                  <h3 className="text-2xl font-bold text-white mb-3">Menghubungkan Ide & Kode Menjadi Solusi Digital</h3>
                  <p className="text-slate-300 text-sm md:text-base leading-relaxed mb-3">
                    Halo! Saya <span className="text-[#00d2ff] font-semibold">{personalInfo.name}</span>, Junior Web Developer dengan passion mendalam di ekosistem web modern seperti React, Tailwind CSS, dan animasi interaktif yang elegan.
                  </p>
                  <p className="text-slate-400 text-sm md:text-base leading-relaxed">
                    Fokus saya adalah menciptakan pengalaman visual kosmik yang memukau dengan arsitektur kode yang bersih dan performa tinggi.
                  </p>
                </div>

                {/* Stats */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  {personalInfo.stats.map((s, i) => (
                    <div key={i} className="p-4 rounded-2xl bg-[#060b1e]/90 border border-[#2c67ed]/30 text-center shadow-[0_0_12px_rgba(44,103,237,0.15)]">
                      <span className="text-2xl md:text-3xl font-extrabold bg-gradient-to-r from-white to-[#8eb6fd] bg-clip-text text-transparent block">
                        {s.value}
                      </span>
                      <span className="text-xs text-slate-400 mt-1 block">{s.label}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Experience & Education Tabs */}
            <div className="flex justify-center mb-6">
              <div className="inline-flex p-1.5 rounded-2xl bg-[#060b1e]/80 border border-[#2c67ed]/40">
                <button
                  onClick={() => setAboutSubTab('experience')}
                  className={`px-6 py-2 rounded-xl text-sm font-semibold transition-all ${
                    aboutSubTab === 'experience'
                      ? 'bg-gradient-to-r from-[#2c67ed] to-[#1d4fd8] text-white shadow-[0_0_15px_rgba(44,103,237,0.6)]'
                      : 'text-slate-400 hover:text-white'
                  }`}
                >
                  💼 Pengalaman
                </button>
                <button
                  onClick={() => setAboutSubTab('education')}
                  className={`px-6 py-2 rounded-xl text-sm font-semibold transition-all ${
                    aboutSubTab === 'education'
                      ? 'bg-gradient-to-r from-[#2c67ed] to-[#1d4fd8] text-white shadow-[0_0_15px_rgba(44,103,237,0.6)]'
                      : 'text-slate-400 hover:text-white'
                  }`}
                >
                  🎓 Riwayat Pendidikan
                </button>
              </div>
            </div>

            <div className="max-w-4xl mx-auto space-y-4">
              {aboutSubTab === 'experience'
                ? personalInfo.experience.map((exp, idx) => (
                    <div key={idx} className="p-6 rounded-2xl bg-[#060b1e]/75 border border-[#2c67ed]/30 shadow-[0_0_15px_rgba(44,103,237,0.15)]">
                      <div className="flex justify-between items-start mb-2">
                        <div>
                          <h4 className="text-lg font-bold text-white">{exp.role}</h4>
                          <p className="text-sm text-[#8eb6fd]">{exp.company} &bull; <span className="text-slate-400">{exp.type}</span></p>
                        </div>
                        <span className="text-xs font-mono text-[#00d2ff] bg-[#2c67ed]/20 px-3 py-1 rounded-full">{exp.period}</span>
                      </div>
                      <p className="text-slate-300 text-sm mb-3">{exp.description}</p>
                      <div className="flex flex-wrap gap-2">
                        {exp.technologies.map((t, i) => (
                          <span key={i} className="px-2.5 py-0.5 rounded-lg bg-[#0b1430] border border-white/10 text-slate-300 text-xs font-mono">
                            #{t}
                          </span>
                        ))}
                      </div>
                    </div>
                  ))
                : personalInfo.education.map((edu, idx) => (
                    <div key={idx} className="p-6 rounded-2xl bg-[#060b1e]/75 border border-[#2c67ed]/30 shadow-[0_0_15px_rgba(44,103,237,0.15)]">
                      <div className="flex justify-between items-start mb-2">
                        <div>
                          <h4 className="text-lg font-bold text-white">{edu.degree}</h4>
                          <p className="text-sm text-[#8eb6fd]">{edu.institution}</p>
                        </div>
                        <span className="text-xs font-mono text-[#00d2ff] bg-[#2c67ed]/20 px-3 py-1 rounded-full">{edu.period}</span>
                      </div>
                      <p className="text-slate-300 text-sm mb-3">{edu.description}</p>
                      <div className="text-xs text-emerald-400 font-semibold bg-emerald-950/50 px-2.5 py-1 rounded-md inline-block">
                        Capaian: {edu.gpa} &bull; {edu.highlight}
                      </div>
                    </div>
                  ))}
            </div>
          </section>

          {/* PORTFOLIO SECTION */}
          <section id="portfolio" className="relative py-24 px-4 md:px-8 max-w-7xl mx-auto z-10">
            <div className="text-center mb-12">
              <span className="px-3.5 py-1.5 rounded-full bg-[#0b1430] border border-[#2c67ed]/40 text-xs font-mono uppercase tracking-widest text-[#00d2ff] mb-3 inline-block">
                Karya & Kompetensi
              </span>
              <h2 className="text-3xl md:text-5xl font-extrabold text-white">
                Featured <span className="bg-gradient-to-r from-[#00d2ff] to-[#2c67ed] bg-clip-text text-transparent">Portfolio</span>
              </h2>
            </div>

            {/* Main Tabs */}
            <div className="flex justify-center mb-10">
              <div className="inline-flex p-1.5 rounded-2xl bg-[#060b1e]/90 border border-[#2c67ed]/40 shadow-[0_0_20px_rgba(44,103,237,0.3)]">
                {['projects', 'certificates', 'techstack'].map(tab => (
                  <button
                    key={tab}
                    onClick={() => setPortfolioTab(tab)}
                    className={`px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold capitalize transition-all ${
                      portfolioTab === tab
                        ? 'bg-gradient-to-r from-[#2c67ed] to-[#1d4fd8] text-white shadow-[0_0_15px_rgba(44,103,237,0.6)]'
                        : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    {tab === 'techstack' ? 'Tech Stack' : tab}
                  </button>
                ))}
              </div>
            </div>

            {/* Tab: Projects */}
            {portfolioTab === 'projects' && (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {personalInfo.projects.map(p => (
                  <div key={p.id} className="rounded-3xl bg-[#060b1e]/85 border border-[#2c67ed]/30 hover:border-[#00d2ff]/70 shadow-[0_0_20px_rgba(44,103,237,0.15)] hover:shadow-[0_0_30px_rgba(44,103,237,0.35)] transition-all overflow-hidden flex flex-col justify-between">
                    <div>
                      <div className="aspect-video w-full overflow-hidden relative">
                        <img src={p.image} alt={p.title} className="w-full h-full object-cover hover:scale-105 transition-transform duration-500" />
                        <span className="absolute top-3 left-3 px-2.5 py-0.5 rounded-full bg-[#060b1e]/90 border border-[#2c67ed]/50 text-[11px] font-mono text-[#00d2ff]">
                          {p.category}
                        </span>
                      </div>
                      <div className="p-6">
                        <h3 className="text-xl font-bold text-white mb-2">{p.title}</h3>
                        <p className="text-slate-400 text-sm leading-relaxed mb-4">{p.description}</p>
                        <div className="flex flex-wrap gap-1.5 mb-4">
                          {p.tags.map((t, idx) => (
                            <span key={idx} className="px-2 py-0.5 rounded bg-[#0b1430] border border-[#2c67ed]/30 text-xs font-mono text-slate-300">
                              #{t}
                            </span>
                          ))}
                        </div>
                      </div>
                    </div>
                    <div className="px-6 pb-6 pt-2 border-t border-white/5 flex justify-between items-center text-xs font-semibold">
                      <a href={p.demoUrl} target="_blank" className="text-[#00d2ff] hover:underline">↗ Live Demo</a>
                      <a href={p.githubUrl} target="_blank" className="text-slate-400 hover:text-white">GitHub Repo</a>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* Tab: Certificates */}
            {portfolioTab === 'certificates' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl mx-auto">
                {personalInfo.certificates.map(c => (
                  <div key={c.id} className="p-6 rounded-3xl bg-[#060b1e]/85 border border-[#2c67ed]/30 shadow-[0_0_20px_rgba(44,103,237,0.15)] flex flex-col justify-between">
                    <div>
                      <div className="flex justify-between items-start mb-4">
                        <span className="text-2xl">🏆</span>
                        <span className="text-xs font-mono text-[#00d2ff] bg-[#2c67ed]/20 px-2 py-0.5 rounded-full">{c.issueDate}</span>
                      </div>
                      <h3 className="text-lg font-bold text-white mb-1">{c.title}</h3>
                      <p className="text-sm text-[#8eb6fd] mb-4">Penerbit: {c.issuer}</p>
                      <div className="flex flex-wrap gap-1.5 mb-4">
                        {c.skills.map((s, idx) => (
                          <span key={idx} className="px-2 py-0.5 rounded bg-[#0b1430] text-xs font-mono text-slate-300">
                            ✓ {s}
                          </span>
                        ))}
                      </div>
                    </div>
                    <div className="pt-3 border-t border-white/10 text-xs font-mono text-slate-400">
                      ID: <span className="text-slate-200">{c.credentialId}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* Tab: Tech Stack */}
            {portfolioTab === 'techstack' && (
              <div className="space-y-8 max-w-5xl mx-auto">
                {personalInfo.techStack.map((cat, idx) => (
                  <div key={idx} className="p-6 rounded-3xl bg-[#060b1e]/80 border border-[#2c67ed]/30 shadow-[0_0_20px_rgba(44,103,237,0.15)]">
                    <h3 className="text-xl font-bold text-white mb-1">{cat.category}</h3>
                    <p className="text-xs text-slate-400 mb-6">{cat.description}</p>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                      {cat.items.map((tech, i) => (
                        <div key={i} className="p-4 rounded-2xl bg-[#08112e]/70 border border-[#2c67ed]/20">
                          <div className="flex justify-between items-center mb-2">
                            <span className="font-semibold text-sm text-white">{tech.name}</span>
                            <span className="text-xs font-mono text-[#00d2ff]">{tech.level}</span>
                          </div>
                          <div className="w-full bg-[#030712] rounded-full h-2 overflow-hidden border border-white/5">
                            <div className="h-full rounded-full bg-gradient-to-r from-[#2c67ed] to-[#00d2ff]" style={{ width: `${tech.proficiency}%` }} />
                          </div>
                          <div className="text-right text-[10px] font-mono text-slate-400 mt-1">{tech.proficiency}%</div>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </section>

          {/* CONTACT SECTION */}
          <section id="contact" className="relative py-24 px-4 md:px-8 max-w-7xl mx-auto z-10">
            <div className="text-center mb-16">
              <span className="px-3.5 py-1.5 rounded-full bg-[#0b1430] border border-[#2c67ed]/40 text-xs font-mono uppercase tracking-widest text-[#00d2ff] mb-3 inline-block">
                Koneksi & Sinyal
              </span>
              <h2 className="text-3xl md:text-5xl font-extrabold text-white">
                Contact <span className="bg-gradient-to-r from-[#00d2ff] to-[#2c67ed] bg-clip-text text-transparent">Me</span>
              </h2>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 max-w-5xl mx-auto">
              {/* Info */}
              <div className="lg:col-span-5 space-y-4">
                <div className="p-6 rounded-3xl bg-[#060b1e]/85 border border-[#2c67ed]/30 shadow-[0_0_20px_rgba(44,103,237,0.15)]">
                  <h3 className="text-xl font-bold text-white mb-2">Mari Terhubung</h3>
                  <p className="text-slate-400 text-sm mb-4 leading-relaxed">
                    Punya ide proyek menarik atau ingin berkolaborasi? Jangan ragu untuk mengirim pesan!
                  </p>
                  <div className="p-3.5 rounded-xl bg-[#0b1430] border border-[#2c67ed]/30 flex items-center justify-between">
                    <span className="text-xs text-white font-mono truncate">{personalInfo.email}</span>
                    <button onClick={handleCopyEmail} className="px-3 py-1 bg-[#2c67ed]/30 hover:bg-[#2c67ed] text-[#00d2ff] hover:text-white rounded-lg text-xs font-semibold">
                      {copied ? '✓ Copied' : 'Copy'}
                    </button>
                  </div>
                </div>

                <div className="p-6 rounded-3xl bg-[#060b1e]/85 border border-[#2c67ed]/30">
                  <h4 className="text-xs font-mono uppercase text-slate-400 mb-3">Sosial Media</h4>
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    {Object.entries(personalInfo.socials).map(([key, url]) => (
                      <a key={key} href={url} target="_blank" className="p-2.5 rounded-xl bg-[#0b1430] hover:bg-[#0e1b42] text-slate-300 hover:text-white capitalize border border-white/5">
                        🌐 {key}
                      </a>
                    ))}
                  </div>
                </div>
              </div>

              {/* Form */}
              <div className="lg:col-span-7">
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    setFormSubmitted(true);
                    setTimeout(() => setFormSubmitted(false), 5000);
                  }}
                  className="p-6 sm:p-8 rounded-3xl bg-[#060b1e]/90 border border-[#2c67ed]/40 shadow-[0_0_30px_rgba(44,103,237,0.25)] space-y-4"
                >
                  <h3 className="text-2xl font-bold text-white mb-2">Kirim Pesan Kosmik</h3>
                  <div>
                    <label className="block text-xs font-mono text-slate-300 mb-1">Nama Lengkap</label>
                    <input required type="text" placeholder="Nama Anda" className="w-full px-4 py-2.5 rounded-xl bg-[#0b1430] border border-[#2c67ed]/30 text-white text-sm outline-none focus:border-[#00d2ff]" />
                  </div>
                  <div>
                    <label className="block text-xs font-mono text-slate-300 mb-1">Email</label>
                    <input required type="email" placeholder="email@domain.com" className="w-full px-4 py-2.5 rounded-xl bg-[#0b1430] border border-[#2c67ed]/30 text-white text-sm outline-none focus:border-[#00d2ff]" />
                  </div>
                  <div>
                    <label className="block text-xs font-mono text-slate-300 mb-1">Pesan</label>
                    <textarea required rows="4" placeholder="Tuliskan pesan Anda..." className="w-full px-4 py-2.5 rounded-xl bg-[#0b1430] border border-[#2c67ed]/30 text-white text-sm outline-none focus:border-[#00d2ff] resize-none"></textarea>
                  </div>
                  <button type="submit" className="w-full py-3.5 rounded-xl bg-gradient-to-r from-[#2c67ed] to-[#1d4fd8] text-white font-bold text-sm uppercase tracking-wider shadow-[0_0_20px_rgba(44,103,237,0.6)] hover:shadow-[0_0_30px_rgba(0,210,255,0.6)] transition-all">
                    🚀 Luncurkan Pesan
                  </button>

                  {formSubmitted && (
                    <div className="p-3 rounded-xl bg-emerald-950/80 border border-emerald-500 text-emerald-300 text-xs text-center">
                      ✓ Pesan Anda telah siap dikirimkan! Terima kasih.
                    </div>
                  )}
                </form>
              </div>
            </div>
          </section>

          {/* FOOTER */}
          <footer className="border-t border-[#2c67ed]/20 bg-[#030712] py-8 text-center text-xs text-slate-400">
            <p className="font-semibold text-white mb-1">Gangsar.id &bull; Personal Portfolio</p>
            <p className="font-mono text-[#8eb6fd]">React &bull; Tailwind CSS &bull; Framer Motion &bull; Space Edition</p>
            <p className="text-[11px] text-slate-500 mt-3">&copy; {new Date().getFullYear()} Gangsar Wijaya. All rights reserved.</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
